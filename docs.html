<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Willett Brands Documentation</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #f6f7f8;
    --surface: #ffffff;
    --border: #e3e5e8;
    --text: #1a1d21;
    --text-muted: #6b7280;
    --accent: #4f46e5;
    --label-bg: #eef0ff;
    --label-text: #3730a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  a.nav-link { font-size: 13px; color: var(--accent); text-decoration: none; }
  a.nav-link:hover { text-decoration: underline; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 1.25rem; }
  .tabs button {
    border: none; background: transparent; font-size: 14px; font-weight: 500; padding: 8px 14px;
    cursor: pointer; color: var(--text-muted); font-family: inherit; border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs .count { font-weight: 400; color: var(--text-muted); }

  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }

  .search {
    width: 100%; font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-family: inherit; margin-bottom: 8px;
  }

  .doc-list { display: flex; flex-direction: column; gap: 4px; }
  .doc-list button {
    display: block; width: 100%; text-align: left; border: none; background: transparent;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; font-family: inherit;
  }
  .doc-list button:hover { background: var(--surface); }
  .doc-list button.active { background: var(--label-bg); }
  .doc-title { font-size: 13px; color: var(--text); }
  .doc-list button.active .doc-title { color: var(--label-text); font-weight: 500; }
  .doc-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .doc-content { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem 2rem; min-height: 200px; }
  .doc-content h1 { font-size: 20px; }
  .doc-content h2 { font-size: 17px; }
  .doc-content h3 { font-size: 15px; }
  .doc-content :is(h1, h2, h3) { font-weight: 600; margin: 1.2em 0 0.4em; }
  .doc-content p, .doc-content li { font-size: 14px; line-height: 1.65; color: var(--text); }
  .doc-content code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .doc-content pre { background: var(--bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
  .doc-content pre code { background: none; padding: 0; }
  .doc-content a { color: var(--accent); }
  .doc-source { font-size: 12px; color: var(--text-muted); margin-top: 1.5rem; padding-top: 0.75rem; border-top: 1px solid var(--border); }
  .empty { color: var(--text-muted); font-size: 14px; padding: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Documentation</h1>
    <a class="nav-link" href="./index.html">&larr; Dashboard</a>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="layout">
    <div>
      <input type="text" class="search" id="search" placeholder="Search docs...">
      <div class="doc-list" id="doc-list"></div>
    </div>
    <div class="doc-content" id="doc-content"><div class="empty">Select a document.</div></div>
  </div>
</div>

<script>
let DOCS = [];
let activeRepo = null;
let activePath = null;
let query = '';

function timeAgo(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  const units = [[60, 's'], [60, 'm'], [24, 'h'], [7, 'd'], [4.345, 'w'], [12, 'mo'], [Infinity, 'y']];
  let val = diff, i = 0;
  for (const [span] of units) {
    if (val < span) break;
    val /= span;
    i++;
  }
  return `${Math.max(1, Math.round(val))}${units[i][1]} ago`;
}

// Plain case-insensitive substring match against title and content - a doc
// only shows up if the search term literally appears somewhere in it.
// (A fuzzy subsequence match was tried first, but against multi-KB doc
// content almost any short query's letters appear "in order" somewhere
// purely by chance, so it never actually filtered anything out.)
function matchDocs(docs) {
  if (!query) return docs;

  const q = query.toLowerCase();
  return docs
    .map((d) => {
      const titleIdx = d.title.toLowerCase().indexOf(q);
      const contentIdx = d.content.toLowerCase().indexOf(q);
      const matched = titleIdx >= 0 || contentIdx >= 0;
      // Title matches rank above content matches; earlier matches rank higher within each.
      const score = titleIdx >= 0 ? 100000 - titleIdx : 1000 - contentIdx;
      return { doc: d, score, matched };
    })
    .filter((r) => r.matched)
    .sort((a, b) => b.score - a.score)
    .map((r) => r.doc);
}

function renderTabs() {
  const repos = ['kaydence', 'engagement-hub'];
  document.getElementById('tabs').innerHTML = repos.map((repo) => {
    const count = DOCS.filter((d) => d.repo === repo).length;
    return `<button data-repo="${repo}" class="${repo === activeRepo ? 'active' : ''}">${repo} <span class="count">(${count})</span></button>`;
  }).join('');
}

function renderList() {
  const docs = matchDocs(DOCS.filter((d) => d.repo === activeRepo));
  const listEl = document.getElementById('doc-list');

  if (!docs.length) {
    listEl.innerHTML = `<div class="empty">${query ? 'No matching docs.' : 'No docs yet.'}</div>`;
    return;
  }

  listEl.innerHTML = docs.map((d) => `
    <button data-path="${d.path}" class="${d.path === activePath ? 'active' : ''}">
      <div class="doc-title">${escapeHtml(d.title)}</div>
      <div class="doc-meta">${d.updatedAt ? `Updated ${timeAgo(d.updatedAt)}${d.updatedBy ? ' by ' + escapeHtml(d.updatedBy) : ''}` : ''}</div>
    </button>
  `).join('');
}

function renderContent() {
  const doc = DOCS.find((d) => d.repo === activeRepo && d.path === activePath);
  const el = document.getElementById('doc-content');

  if (!doc) {
    el.innerHTML = '<div class="empty">Select a document.</div>';
    return;
  }

  el.innerHTML = `
    ${marked.parse(doc.content)}
    <div class="doc-source">
      ${doc.updatedAt ? `Last updated ${timeAgo(doc.updatedAt)}${doc.updatedBy ? ' by ' + escapeHtml(doc.updatedBy) : ''} &middot; ` : ''}
      <a href="${doc.url}" target="_blank" rel="noopener">View source on GitHub</a>
    </div>
  `;
}

function selectRepo(repo) {
  activeRepo = repo;
  const docs = matchDocs(DOCS.filter((d) => d.repo === repo));
  activePath = docs[0]?.path ?? null;
  renderTabs();
  renderList();
  renderContent();
}

function selectDoc(path) {
  activePath = path;
  renderList();
  renderContent();
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (btn) selectRepo(btn.dataset.repo);
});

document.getElementById('doc-list').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (btn) selectDoc(btn.dataset.path);
});

document.getElementById('search').addEventListener('input', (e) => {
  query = e.target.value.trim();
  renderList();
  // Auto-select the top match so the content pane stays useful while typing.
  const docs = matchDocs(DOCS.filter((d) => d.repo === activeRepo));
  if (docs.length && !docs.some((d) => d.path === activePath)) {
    activePath = docs[0].path;
    renderContent();
    renderList();
  }
});

fetch(`./docs.json?t=${Date.now()}`, { cache: 'no-store' })
  .then((r) => r.json())
  .then((data) => {
    DOCS = data.docs ?? [];
    const preferred = ['kaydence', 'engagement-hub'].find((r) => DOCS.some((d) => d.repo === r));
    selectRepo(preferred ?? 'kaydence');
  })
  .catch((err) => {
    document.getElementById('doc-content').innerHTML = '<div class="empty">Failed to load docs.json</div>';
    console.error(err);
  });
</script>
</body>
</html>
