<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Willett Brands Dashboard</title>
<style>
  :root {
    --bg: #f6f7f8;
    --surface: #ffffff;
    --border: #e3e5e8;
    --text: #1a1d21;
    --text-muted: #6b7280;
    --accent: #4f46e5;
    --label-bg: #eef0ff;
    --label-text: #3730a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  #updated { font-size: 13px; color: var(--text-muted); }
  h2 { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 0 0 0.75rem; }
  section { margin-bottom: 2.5rem; }
  .card-list { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    text-decoration: none;
    color: inherit;
  }
  .card:hover { border-color: var(--accent); }
  .card-main { min-width: 0; flex: 1; }
  .card-title { font-size: 14px; font-weight: 500; margin: 0; word-break: break-word; }
  .card-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .repo-tag { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--label-bg); color: var(--label-text); white-space: nowrap; }
  .sha { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-muted); }
  .labels { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #f1f2f4; color: #4b5563; }
  .empty { color: var(--text-muted); font-size: 14px; padding: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Willett Brands Dashboard</h1>
    <span id="updated"></span>
  </header>

  <section>
    <h2>Recent commits</h2>
    <div id="commits" class="card-list"></div>
  </section>

  <section>
    <h2>Open issues</h2>
    <div id="issues" class="card-list"></div>
  </section>
</div>

<script>
function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  const units = [[60, 's'], [60, 'm'], [24, 'h'], [7, 'd'], [4.345, 'w'], [12, 'mo'], [Infinity, 'y']];
  let val = diff, i = 0;
  for (const [span] of units) {
    if (val < span) break;
    val /= span;
    i++;
  }
  return `${Math.max(1, Math.round(val))}${units[i][1]} ago`;
}

fetch('./data.json')
  .then((r) => r.json())
  .then((data) => {
    document.getElementById('updated').textContent = `Updated ${timeAgo(data.generatedAt)}`;

    const commitsEl = document.getElementById('commits');
    if (!data.commits.length) {
      commitsEl.innerHTML = '<div class="empty">No recent commits.</div>';
    } else {
      commitsEl.innerHTML = data.commits.map((c) => `
        <a class="card" href="${c.url}" target="_blank" rel="noopener">
          <div class="card-main">
            <p class="card-title">${escapeHtml(c.message)}</p>
            <div class="card-meta">
              <span class="repo-tag">${c.repo}</span>
              <span class="sha">${c.sha}</span>
              <span>${escapeHtml(c.author)}</span>
            </div>
          </div>
          <div class="card-meta">${timeAgo(c.date)}</div>
        </a>
      `).join('');
    }

    const issuesEl = document.getElementById('issues');
    if (!data.issues.length) {
      issuesEl.innerHTML = '<div class="empty">No open issues.</div>';
    } else {
      issuesEl.innerHTML = data.issues.map((i) => `
        <a class="card" href="${i.url}" target="_blank" rel="noopener">
          <div class="card-main">
            <p class="card-title">#${i.number} ${escapeHtml(i.title)}</p>
            <div class="card-meta">
              <span class="repo-tag">${i.repo}</span>
              ${i.assignees.length ? `<span>${i.assignees.map(escapeHtml).join(', ')}</span>` : '<span>Unassigned</span>'}
            </div>
            ${i.labels.length ? `<div class="labels">${i.labels.map((l) => `<span class="pill">${escapeHtml(l)}</span>`).join('')}</div>` : ''}
          </div>
          <div class="card-meta">${timeAgo(i.updatedAt)}</div>
        </a>
      `).join('');
    }
  })
  .catch((err) => {
    document.getElementById('updated').textContent = 'Failed to load data.json';
    console.error(err);
  });

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}
</script>
</body>
</html>
